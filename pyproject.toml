[project]
name = "prosenos"
version = "0.1.0"
description = "Sports match tracking API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.136.3",
    "sqlalchemy>=2.0",
    "httpx>=0.28.0",
    "curl-cffi>=0.16.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
prosenos = "app.main:main"

[tool.ruff]
ignore = ["TC001"]
